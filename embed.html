<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trinkets Arcade game</title>
    <meta name="theme-color" content="#fff8ea" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-touch-icon-120x120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trinkets Arcade" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="trinkets-build" content="dev" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css?v=29" />
    <link rel="stylesheet" href="penguin-tycoon.css?v=29" />
  </head>
  <body class="embed">
    <div class="small-screen-warning" role="alert"><span class="material-symbols-outlined" aria-hidden="true">warning</span> Trinkets Arcade is not supported on very small screens — please enlarge your window or rotate your device.</div>
    <span id="favoriteCount" hidden>0</span>
    <div class="game-modal" id="gameModal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header">
          <div>
            <p class="eyebrow" id="modalKicker">Mini-game</p>
            <h2 id="modalTitle">Game</h2>
          </div>
          <div class="modal-buttons">
            <button class="feedback-button" id="feedbackButton" type="button" title="Send feedback for this game" aria-label="Send feedback for this game"><span class="material-symbols-outlined">feedback</span></button>
            <button class="embed-button" id="embedButton" type="button" title="Copy embed code" aria-label="Copy embed code"><span class="material-symbols-outlined">code</span></button>
            <button class="close-button" id="closeGame" type="button" aria-label="Close game">x</button>
          </div>
        </header>
        <div class="game-shell" id="gameShell"></div>
      </div>
    </div>
    <div class="embed-caption" id="embedCaption" hidden>
      <span class="embed-stat" id="embedStat"></span>
      <a class="embed-link" href="./" target="_top">Trinkets Arcade</a>
    </div>
    <script src="script.js?v=29"></script>
    <script src="powder.js?v=7"></script>
    <script src="toys.js?v=9"></script>
    <script src="facts.js?v=6"></script>
    <script src="orchard.js?v=4"></script>
    <script src="curios.js?v=6"></script>
    <script src="penguin.js?v=10"></script>
    <script src="penguin-defence.js?v=10"></script>
    <script src="spider.js?v=1"></script>
    <script src="ikea.js?v=1"></script>
    <script src="flappy.js?v=1"></script>
    <script src="zigzag.js?v=1"></script>
    <script src="gravityball.js?v=1"></script>
    <script src="tetris.js?v=1"></script>
    <script src="tag.js?v=1"></script>
    <script src="ludo.js?v=1"></script>
    <script src="magnet-mayhem.js?v=1"></script>
    <script src="tile-engine.js?v=29"></script>
    <script src="penguin-tycoon.js?v=29"></script>
    <script src="leaderboards.js?v=2"></script>
    <script>
      (function bootEmbed() {
        const params = new URLSearchParams(location.search);
        const id = slugToGame(params.get("game") || "");
        if (!id || !showGame(id)) {
          location.replace("./");
          return;
        }
        document.title = document.querySelector("#modalTitle").textContent + " on Trinkets Arcade";
        document.querySelector("#embedCaption").hidden = false;
        const stat = document.querySelector("#embedStat");
        setInterval(() => {
          try {
            stat.textContent = embedStatText(JSON.parse(window.render_game_to_text()));
          } catch (err) {}
        }, 500);
      })();
    </script>
  </body>
</html>

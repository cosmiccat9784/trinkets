<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback · Trinkets Arcade</title>
    <meta name="theme-color" content="#fff8ea" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-touch-icon-120x120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trinkets Arcade" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Trinkets Arcade home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Trinkets Arcade</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="./#games">Games</a>
        <a href="./">← Back to arcade</a>
      </nav>
    </header>

    <main>
      <section class="feedback-wrap" aria-labelledby="feedback-title">
        <div class="feedback-card">
          <div>
            <p class="eyebrow">Feedback</p>
            <h2 id="feedback-title">Send feedback</h2>
          </div>
          <p class="feedback-sub">No account needed. Reports go straight to the dev, anonymously.</p>
          <label class="feedback-label">Game
            <select class="game-input feedback-select" id="fbGame">
              <option value="">Whole arcade</option>
              <option value="switchback">Switchback Tiles</option>
              <option value="comet">Comet Catch</option>
              <option value="forge">Four-Letter Forge</option>
              <option value="maze">Pocket Maze</option>
              <option value="bash">Button Bash</option>
              <option value="clue">Clue Crate</option>
              <option value="toybox">Toybox</option>
              <option value="thousand">2048</option>
              <option value="powder">Powder Sim</option>
              <option value="wrap">Bubble Wrap</option>
              <option value="zen">Zen Sand</option>
              <option value="gravity">Gravity Balls</option>
              <option value="spiro">Spirograph</option>
              <option value="facts">Useless Facts</option>
              <option value="orchard">Orchard Go</option>
              <option value="magnet">Magnet Mess</option>
              <option value="ice">Ice Cube</option>
              <option value="coin">Coin Flip</option>
              <option value="cheese">Cheese Thief</option>
              <option value="machine">Completely Normal Machine</option>
              <option value="onebutton">One Button</option>
              <option value="penguin">Penguin Parkour</option>
              <option value="defence">Penguin Defence</option>
              <option value="spider">Spider</option>
              <option value="ikea">Guess the IKEA Product</option>
            </select>
          </label>
          <label class="feedback-label">Type
            <select class="game-input feedback-select" id="fbType">
              <option>Bug</option>
              <option>Idea</option>
              <option>Praise</option>
              <option>Other</option>
            </select>
          </label>
          <label class="feedback-label">Subject
            <input class="game-input" id="fbSubject" maxlength="80" autocomplete="off" placeholder="Short summary" />
          </label>
          <label class="feedback-label">Details
            <textarea class="game-textarea" id="fbDetails" rows="4" placeholder="What happened? What did you expect?"></textarea>
          </label>
          <p class="game-message" id="fbMsg"></p>
          <div class="game-actions">
            <button class="primary-button" id="fbSendAnon" type="button">Send anonymously</button>
          </div>
        </div>

        <div class="feedback-card">
          <h2>Your sent feedback</h2>
          <ul class="feedback-log" id="fbLog"></ul>
          <div class="game-actions">
            <button class="game-action" id="fbClear" type="button">Clear history</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Trinkets Arcade keeps the shelf stocked with small, silly, satisfying playthings.</p>
    </footer>

    <script src="feedback.js?v=4"></script>
  </body>
</html>
